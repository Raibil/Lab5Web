<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Proyek - Kalkulator Nilai Mahasiswa</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 16px; cursor: pointer; }
    .error { color: #c0392b; margin-top: 12px; }
    .hasil { margin-top: 16px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; }
    .hasil p { margin: 6px 0; }
  </style>
</head>
<body>
  <h1>Kalkulator Nilai Mahasiswa</h1>

  <form id="formNilai" novalidate>
    <label for="tugas">Nilai Tugas (0–100):</label>
    <input type="number" id="tugas" step="any">

    <label for="uts">Nilai UTS (0–100):</label>
    <input type="number" id="uts" step="any">

    <label for="uas">Nilai UAS (0–100):</label>
    <input type="number" id="uas" step="any">

    <button type="submit">Hitung</button>
  </form>

  <p id="pesanError" class="error"></p>

  <div id="hasil" class="hasil" hidden>
    <p>Nilai akhir: <strong id="hasilAkhir"></strong></p>
    <p>Predikat: <strong id="hasilPredikat"></strong></p>
    <p>Status: <strong id="hasilStatus"></strong></p>
  </div>

  <script src="script-miniproyek.js"></script>
</body>
</html>
